baseURL: "https://billswymer-cmyk.github.io/drbillswymer/"
title: "Dr. Bill Swymer"

enableRobotsTXT: true
enableEmoji: false

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

params:
  appearance:
    mode: light
    color: custom
    font: native
  header:
    navbar:
      enable: true
      align: right
      logo:
        text: "BILL SWYMER"
      show_search: true
  features:
    search:
      provider: flexsearch
  extensions:
    css:
      - css/custom.css
  mysite:
    credit: true
    discovery: true

menu:
  main:
    - name: C.V.
      url: /cv/
      weight: 45
    - name: Education
      url: /education/
      weight: 10
    - name: Publications
      url: /publication/
      weight: 48
    - name: Research
      url: /research/
      weight: 30
    - name: Co-Authors
      url: /people/
      weight: 49
    - name: Contact
      url: /contact/
      weight: 50
